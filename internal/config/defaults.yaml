project:
  # Display name; empty means the project root directory's name.
  name: ""

storage:
  # SQLite database; relative paths resolve against the project root.
  path: .ralph/ralph.db

log:
  # debug | info | warn | error. Logs always go to stderr.
  level: info
  # text | json
  format: text

embeddings:
  # ollama | none. With none, search uses keyword matching only.
  provider: ollama
  # Per-request timeout for embedding calls.
  timeout: 30s
  chunk:
    # Documents are split on markdown headings, then packed up to this size.
    max_chars: 2000
    # Characters repeated between consecutive chunks of an oversized section.
    overlap_chars: 200
  ollama:
    base_url: http://localhost:11434
    model: nomic-embed-text
    # Text prepended to search queries and to stored content before embedding.
    # "auto" uses the prefixes the model's authors specify (none for unknown
    # models); any other value, including "", is used as-is. Changing
    # document_prefix makes stored embeddings stale until `ralph index` runs.
    query_prefix: auto
    document_prefix: auto

search:
  # Default number of results.
  limit: 10

harness:
  # Harness used by every step unless the step overrides it.
  default: claude_code
  claude_code:
    binary: claude
    # Empty uses the harness's own default model.
    model: ""
    # Passed as --permission-mode to headless loop runs. Loop runs also pass
    # --permission-prompts none, so anything that would prompt is denied.
    permission_mode: auto
    # Spending cap per loop iteration in USD, passed as --max-budget-usd.
    # 0 means no cap. A session that hits the cap counts as a failed iteration.
    max_budget_usd: 0
    # Appended verbatim to every invocation.
    extra_args: []

# Per-step overrides. Empty values inherit from the harness section.
steps:
  receive:
    harness: ""
    model: ""
  articulate:
    harness: ""
    model: ""
  loop:
    harness: ""
    model: ""
  pr:
    harness: ""
    model: ""

receive:
  # Ask for approval, in the harness's plan mode, before /ralph:receive creates
  # a new initiative's milestones and tasks. When false, the outline is created
  # right away and then shown. Revisions always ask.
  confirm_outline: false

import:
  # Largest file `ralph import` will queue, in bytes; bigger files are skipped.
  max_file_bytes: 1048576

loop:
  # Hard cap on iterations in one loop run.
  max_iterations: 50
  # Stall Statute: consecutive failed iterations on one task before it is
  # marked BLOCKED and the loop stops to ask for help.
  stall_threshold: 3
  # Go text/template; fields: .Initiative and .Milestone, each with .ID, .Slug,
  # .Title, .CardKey, and .CardKeyPrefix. .CardKey is the key of the entity's card
  # in the task manager and .CardKeyPrefix is that key followed by "-"; both are
  # empty without a card.
  branch_template: "ralph/{{.Milestone.Slug}}"
  # Commit after each completed task.
  commit_per_task: true
  # Go text/template for those commits; fields: .Task (.ID, .Title, ...,
  # .CardKey, and .CardKeyPrefix, which is "[ABC-1235] " or empty), .Initiative
  # and .Milestone (each with .ID, .Slug, .Title). .CardKey and .CardKeyPrefix
  # come from the task's own card and are empty without one.
  commit_template: "{{.Task.ID}}: {{.Task.Title}}"
  # Add a `Ralph-Task: <task ID>` trailer to those commits, so ralph can match
  # commits to tasks after history is rewritten (rebase, amend, squash).
  commit_trailer: true
  # Add a `Card: <key>` trailer holding the task's own task manager card key,
  # only when the task has a card. The key makes the commit searchable from the
  # task manager and survives edits to the subject line.
  commit_card_trailer: false
  # Path to a custom iteration prompt template; empty uses the built-in one.
  prompt_template: ""

pr:
  # bitbucket_cloud
  provider: bitbucket_cloud
  base_branch: main
  draft: true
  bitbucket_cloud:
    workspace: ""
    repo_slug: ""
    # Name of the environment variable holding the API token. Never put the
    # token itself in a config file.
    token_env: RALPH_BITBUCKET_TOKEN

task_manager:
  # none | jira. With none, ralph does not touch any task manager.
  provider: none
  # Per-request timeout for task manager calls.
  timeout: 10s
  jira:
    base_url: ""
    project_key: ""
    # Names of environment variables holding the account email and API token.
    # Never put the credentials themselves in a config file.
    email_env: RALPH_JIRA_EMAIL
    token_env: RALPH_JIRA_TOKEN
    # Jira issue type names used for each ralph resource.
    issue_types:
      initiative: Epic
      milestone: Task
      task: Sub-task
    # Name of the status a card moves to when its resource is cancelled or
    # deleted. Empty leaves the card alone.
    canceled_status: ""
    # Labels added to every card when it is created, besides ralph's own
    # ("ralph" and the resource's ID). Labels cannot contain whitespace.
    labels: []
    # Maps a ralph status (task or milestone) to the name of the Jira status
    # its card moves to. A blank value means do not move the card; a status
    # that is not listed leaves the card alone. CANCELLED and deleted
    # resources use canceled_status, not this map. Entries in other config
    # files merge with these.
    status_map:
      TODO: To Do
      IN_PROGRESS: In Progress
      DONE: Done
