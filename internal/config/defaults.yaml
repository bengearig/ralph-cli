project:
  # Display name; empty means the project root directory's name.
  name: ""

storage:
  # SQLite database; relative paths resolve against the project root.
  path: .ralph/ralph.db

log:
  # debug | info | warn | error. Logs always go to stderr.
  level: info
  # text | json
  format: text

embeddings:
  # ollama | none. With none, search uses keyword matching only.
  provider: ollama
  # Per-request timeout for embedding calls.
  timeout: 30s
  chunk:
    # Documents are split on markdown headings, then packed up to this size.
    max_chars: 2000
    # Characters repeated between consecutive chunks of an oversized section.
    overlap_chars: 200
  ollama:
    base_url: http://localhost:11434
    model: nomic-embed-text
    # Text prepended to search queries and to stored content before embedding.
    # "auto" uses the prefixes the model's authors specify (none for unknown
    # models); any other value, including "", is used as-is. Changing
    # document_prefix makes stored embeddings stale until `ralph index` runs.
    query_prefix: auto
    document_prefix: auto

search:
  # Default number of results.
  limit: 10

harness:
  # Harness used by every step unless the step overrides it.
  default: claude_code
  claude_code:
    binary: claude
    # Empty uses the harness's own default model.
    model: ""
    # Passed as --permission-mode to headless loop runs. Loop runs also pass
    # --permission-prompts none, so anything that would prompt is denied.
    permission_mode: auto
    # Spending cap per loop iteration in USD, passed as --max-budget-usd.
    # 0 means no cap. A session that hits the cap counts as a failed iteration.
    max_budget_usd: 0
    # Appended verbatim to every invocation.
    extra_args: []

# Per-step overrides. Empty values inherit from the harness section.
steps:
  receive:
    harness: ""
    model: ""
  articulate:
    harness: ""
    model: ""
  loop:
    harness: ""
    model: ""
  pr:
    harness: ""
    model: ""

receive:
  # Ask for approval, in the harness's plan mode, before /ralph:receive creates
  # a new initiative's milestones and tasks. When false, the outline is created
  # right away and then shown. Revisions always ask.
  confirm_outline: false

import:
  # Largest file `ralph import` will queue, in bytes; bigger files are skipped.
  max_file_bytes: 1048576

ui:
  # auto shows progress on stderr when it is a terminal and one plain line per
  # item otherwise; never turns it off.
  progress: auto

init:
  # auto | manual. auto brings ralph's integration files up to date by itself
  # when a newer ralph needs it; manual only warns and leaves ralph init to you.
  update: auto
  # Project-relative paths of integration files you customized on purpose; the
  # freshness check and the update never touch or report them.
  ignore: []

loop:
  # Hard cap on iterations in one loop run.
  max_iterations: 50
  # Stall Statute: consecutive failed iterations on one task before it is
  # marked BLOCKED and the loop stops to ask for help.
  stall_threshold: 3
  # Go text/template; fields: .Initiative and .Milestone, each with .ID, .Slug,
  # .Title, .CardKey, and .CardKeyPrefix. .CardKey is the key of the entity's card
  # in the task manager and .CardKeyPrefix is that key followed by "-"; both are
  # empty without a card.
  branch_template: "ralph/{{.Milestone.Slug}}"
  # Commit after each completed task.
  commit_per_task: true
  # Go text/template for those commits; fields: .Task (.ID, .Title, ...,
  # .CardKey, and .CardKeyPrefix, which is "[ABC-1235] " or empty), .Initiative
  # and .Milestone (each with .ID, .Slug, .Title). .CardKey and .CardKeyPrefix
  # are the task's own card key, else its milestone's, and are empty when
  # neither has a card.
  commit_template: "{{.Task.ID}}: {{.Task.Title}}"
  # Add a `Ralph-Task: <task ID>` trailer to those commits, so ralph can match
  # commits to tasks after history is rewritten (rebase, amend, squash).
  commit_trailer: true
  # Add a `Card: <key>` trailer holding the task's card key, else its
  # milestone's, only when there is one. The key makes the commit searchable from the
  # task manager and survives edits to the subject line.
  commit_card_trailer: false
  # Path to a custom iteration prompt template; empty uses the built-in one.
  prompt_template: ""

pr:
  # bitbucket_cloud | github
  provider: bitbucket_cloud
  base_branch: main
  # Git remote `ralph pr create` pushes the milestone's branch to.
  remote: origin
  # refuse | sync. What to do when the local base branch is behind pr.remote's: refuse, or fast-forward it first.
  stale_base: refuse
  draft: true
  # Per-request timeout for pull request provider calls.
  timeout: 30s
  bitbucket_cloud:
    workspace: ""
    repo_slug: ""
    # basic | bearer. basic sends the account email and an API token; bearer
    # sends the token alone, as for a repository or workspace access token.
    auth: basic
    # Name of the environment variable holding the account email, used with
    # basic auth. Never put the email itself in a config file.
    email_env: RALPH_BITBUCKET_EMAIL
    # Name of the environment variable holding the API token. Never put the
    # token itself in a config file.
    token_env: RALPH_BITBUCKET_TOKEN
  github:
    # The user or organization that owns the repository.
    owner: ""
    repo: ""
    # Name of the environment variable holding the access token. Never put the
    # token itself in a config file.
    token_env: RALPH_GITHUB_TOKEN

task_manager:
  # none | jira. With none, ralph does not touch any task manager.
  provider: none
  # Per-request timeout for task manager calls.
  timeout: 10s
  # Kinds that get a card when created or synced: initiative, milestone, task.
  # A kind needs its parent kind listed. Cards that already exist are kept in
  # step whether or not their kind is listed. A list set in another config
  # file replaces this one; [] creates no new cards.
  card_kinds: [initiative, milestone]
  jira:
    base_url: ""
    project_key: ""
    # Names of environment variables holding the account email and API token.
    # Never put the credentials themselves in a config file.
    email_env: RALPH_JIRA_EMAIL
    token_env: RALPH_JIRA_TOKEN
    # Jira issue type names used for each ralph resource.
    issue_types:
      initiative: Epic
      milestone: Task
      task: Sub-task
    # Name of the status a card moves to when its resource is cancelled or
    # deleted. Empty leaves the card alone.
    canceled_status: ""
    # Labels added to every card when it is created; ralph adds none of its
    # own. Labels cannot contain whitespace.
    labels: []
    # Original estimate given to a card that has none before ralph moves it,
    # for workflows that require one (for example "5m" or "1h 30m"). Empty
    # leaves cards without an estimate. A card's kind is found from its issue
    # type. An estimate already on the card is never replaced.
    original_estimate:
      initiative: ""
      milestone: ""
      task: ""
    # When true, a card is assigned to the API token's own user when its card
    # is moved to in progress. A card held by someone else is never reassigned.
    assign_on_start: false
    # Maps a ralph status (task or milestone) to the Jira status its card
    # moves to: one name, or a list of names to pass through in order for
    # workflows that do not allow the jump (for example [To Do, In Progress,
    # Done]). A blank value means do not move the card; a status that is not
    # listed leaves the card alone. CANCELLED and deleted resources use
    # canceled_status, not this map. Entries in other config files merge with
    # these.
    status_map:
      TODO: To Do
      IN_PROGRESS: In Progress
      DONE: Done
